<style>
@font-face { font-family: 'Press Start 2P'; src: url('./assets/PressStart2P-Regular.ttf') format('truetype'); font-display: block; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0818; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: 'Press Start 2P', monospace; }

#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; background: #120d24; z-index: 9; }
.btn { position: fixed; display: none; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 18px; background: rgba(40,30,90,.42); border: 3px solid rgba(255,255,255,.38); color: #fff; font-family: inherit; touch-action: none; z-index: 5; text-shadow: 0 2px 0 #0c0820; cursor: pointer; padding: 0; }
